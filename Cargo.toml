[package]
name = "uiaprobe"
version = "0.1.0"
edition = "2021"
description = "Read-only, non-intrusive Windows GUI structure perception CLI using UI Automation"
license = "MIT"

[[bin]]
name = "uiaprobe"
path = "src/main.rs"

[dependencies]
clap = { version = "4", default-features = false, features = ["derive", "std", "help", "usage"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
]

[profile.release]
lto = true
strip = true
codegen-units = 1
panic = "abort"
